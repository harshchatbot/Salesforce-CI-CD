
name: Salesforce CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-salesforce:
    name: Validate Salesforce Deployment
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: salesforce-cicd

    steps:
      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 3. Setup Java for PMD
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Install Salesforce CLI
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      # 5. Install Salesforce Code Analyzer
      - name: Install Salesforce Code Analyzer
        run: sf plugins install @salesforce/plugin-code-analyzer

      # 6. Enforce PMD quality gate
      - name: Run PMD static analysis
        run: |
          sf code-analyzer run \
            --workspace force-app/main/default/classes \
            --rule-selector pmd \
            --severity-threshold 3

      # 7. Authenticate to Salesforce QA
      - name: Authenticate to QA
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
        run: |
          set -euo pipefail
          umask 077

          printf '%s\n' "$SF_JWT_KEY" > "$RUNNER_TEMP/server.key"

          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file "$RUNNER_TEMP/server.key" \
            --username "$SF_USERNAME" \
            --instance-url https://login.salesforce.com \
            --alias qa

      # 8. Validate deployment, tests and coverage
      - name: Validate Apex deployment and enforce coverage
        shell: bash
        run: |
          set -euo pipefail

          sf project deploy start \
            --manifest manifest/package.xml \
            --target-org qa \
            --dry-run \
            --test-level RunSpecifiedTests \
            --tests CICDPracticeServiceTest \
            --wait 30 \
            --json > deployment-result.json

          node <<'NODE'
          const fs = require('fs');

          const data = JSON.parse(
            fs.readFileSync('deployment-result.json', 'utf8')
          );

          const result = data.result || {};
          const tests = result.details?.runTestResult || {};

          const executed = Number(tests.numTestsRun ?? 0);
          const failures = Number(tests.numFailures ?? 0);

          console.log(`Deployment status: ${result.status}`);
          console.log(`Tests executed: ${executed}`);
          console.log(`Tests failed: ${failures}`);

          if (
            data.status !== 0 ||
            result.success !== true ||
            executed === 0 ||
            failures !== 0
          ) {
            console.error('Deployment or Apex test validation failed.');
            process.exit(1);
          }

          const classes = tests.codeCoverage || [];

          if (classes.length === 0) {
            console.error('No Apex coverage data returned.');
            process.exit(1);
          }

          const minimumCoverage = 75;
          let failed = false;

          for (const cls of classes) {
            const total = Number(cls.numLocations);
            const uncovered = Number(cls.numLocationsNotCovered);

            if (
              !Number.isFinite(total) ||
              !Number.isFinite(uncovered) ||
              total <= 0 ||
              uncovered < 0 ||
              uncovered > total
            ) {
              console.error(`Invalid coverage data for ${cls.name}`);
              failed = true;
              continue;
            }

            const coverage = ((total - uncovered) / total) * 100;

            console.log(
              `${cls.name}: ${coverage.toFixed(2)}% coverage`
            );

            if (coverage < minimumCoverage) {
              console.error(
                `${cls.name} failed minimum ${minimumCoverage}% coverage.`
              );
              failed = true;
            }
          }

          if (failed) {
            console.error('Apex coverage quality gate failed.');
            process.exit(1);
          }

          console.log('Apex coverage quality gate passed.');
          NODE

      # 9. Always remove temporary authentication key
      - name: Cleanup JWT private key
        if: always()
        run: rm -f "$RUNNER_TEMP/server.key"
