
name: Salesforce CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-salesforce:
    name: Validate Salesforce Deployment
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: salesforce-cicd

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to QA
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SF_JWT_KEY" > "$RUNNER_TEMP/server.key"

          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file "$RUNNER_TEMP/server.key" \
            --username "$SF_USERNAME" \
            --instance-url https://login.salesforce.com \
            --alias qa

          rm -f "$RUNNER_TEMP/server.key"

      - name: Validate Apex deployment and run tests
        run: |
          sf project deploy start \
            --manifest manifest/package.xml \
            --target-org qa \
            --dry-run \
            --test-level RunSpecifiedTests \
            --tests CICDPracticeServiceTest \
            --wait 30
